name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Source Code
        run: |
          mkdir -p app/src/main/java/com/xprinter/directprint
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "XprinterDirect"
          include ':app'
          EOF

          # 3. build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          # 4. app/build.gradle (minSdk 21 за максимална съвместимост)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.xprinter.directprint'
              compileSdk 34

              defaultConfig {
                  applicationId "com.xprinter.directprint"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Xprinter Direct"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Xprinter 4B-2064C"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="24dp" />
              <EditText
                  android:id="@+id/etIp"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="IP адрес (напр. 192.168.1.150)"
                  android:inputType="phone"
                  android:text="192.168.1.150"
                  android:layout_marginBottom="16dp" />
              <Button
                  android:id="@+id/btnTestPrint"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Тестов печат"
                  android:layout_marginBottom="12dp" />
              <Button
                  android:id="@+id/btnSelectPdf"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Избери PDF и принтирай"
                  android:layout_marginBottom="24dp" />
              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Готов"
                  android:gravity="center"
                  android:textSize="14sp" />
          </LinearLayout>
          EOF

          # 7. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Xprinter Direct</string>
          </resources>
          EOF

          # 8. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/xprinter/directprint/MainActivity.kt
          package com.xprinter.directprint

          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.pdf.PdfRenderer
          import android.net.Uri
          import android.os.Bundle
          import android.os.ParcelFileDescriptor
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import kotlinx.coroutines.*
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.Socket

          class MainActivity : AppCompatActivity() {
              private lateinit var etIp: EditText
              private lateinit var btnSelectPdf: Button
              private lateinit var btnTestPrint: Button
              private lateinit var tvStatus: TextView

              private val pdfPicker = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      tvStatus.text = "Файлът се обработва..."
                      printPdf(uri)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  etIp = findViewById(R.id.etIp)
                  btnSelectPdf = findViewById(R.id.btnSelectPdf)
                  btnTestPrint = findViewById(R.id.btnTestPrint)
                  tvStatus = findViewById(R.id.tvStatus)

                  btnSelectPdf.setOnClickListener {
                      if (etIp.text.toString().trim().isEmpty()) {
                          Toast.makeText(this, "Въведете IP!", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      pdfPicker.launch("application/pdf")
                  }

                  btnTestPrint.setOnClickListener {
                      val ip = etIp.text.toString().trim()
                      if (ip.isEmpty()) {
                          Toast.makeText(this, "Въведете IP!", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      sendRawTspl(ip, "SIZE 100 mm, 150 mm\r\nGAP 3 mm, 0\r\nCLS\r\nTEXT 50,50,\"3\",0,1,1,\"Xprinter Test OK\"\r\nPRINT 1,1\r\n".toByteArray())
                  }
              }

              private fun printPdf(uri: Uri) {
                  val ip = etIp.text.toString().trim()
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          val pfd = contentResolver.openFileDescriptor(uri, "r") ?: return@launch
                          val renderer = PdfRenderer(pfd)
                          if (renderer.pageCount > 0) {
                              val page = renderer.openPage(0)
                              val scale = 203f / 72f
                              val w = (page.width * scale).toInt()
                              val h = (page.height * scale).toInt()
                              val bitmap = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                              bitmap.eraseColor(Color.WHITE)
                              page.render(bitmap, null, null, PdfRenderer.Page.RENDER_MODE_FOR_PRINT)
                              page.close()
                              renderer.close()
                              pfd.close()

                              sendRawTspl(ip, convertBitmapToTspl(bitmap))
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) { tvStatus.text = "Грешка: ${e.message}" }
                      }
                  }
              }

              private fun convertBitmapToTspl(bitmap: Bitmap): ByteArray {
                  val w = bitmap.width
                  val h = bitmap.height
                  val wb = (w + 7) / 8
                  val header = "SIZE 100 mm, 150 mm\r\nGAP 3 mm, 0\r\nCLS\r\nBITMAP 0,0,$wb,$h,0,".toByteArray(Charsets.US_ASCII)
                  val footer = "\r\nPRINT 1,1\r\n".toByteArray(Charsets.US_ASCII)
                  val bytes = ByteArray(wb * h)
                  var idx = 0
                  for (y in 0 until h) {
                      for (bx in 0 until wb) {
                          var b = 0
                          for (bit in 0..7) {
                              val x = bx * 8 + bit
                              if (x < w) {
                                  val p = bitmap.getPixel(x, y)
                                  val lum = (((p shr 16) and 0xFF) * 0.299 + ((p shr 8) and 0xFF) * 0.587 + (p and 0xFF) * 0.114).toInt()
                                  if (lum < 128) b = b or (0x80 shr bit)
                              }
                          }
                          bytes[idx++] = b.toByte()
                      }
                  }
                  return header + bytes + footer
              }

              private fun sendRawTspl(ip: String, data: ByteArray) {
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          withContext(Dispatchers.Main) { tvStatus.text = "Свързване с $ip:9100..." }
                          val socket = Socket()
                          socket.connect(InetSocketAddress(ip, 9100), 5000)
                          val out: OutputStream = socket.getOutputStream()
                          out.write(data)
                          out.flush()
                          out.close()
                          socket.close()
                          withContext(Dispatchers.Main) { tvStatus.text = "Готово! Изпратено към принтера." }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) { tvStatus.text = "Грешка: ${e.message}" }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
